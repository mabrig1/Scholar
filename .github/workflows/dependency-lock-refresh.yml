name: Temporary Dependency Lock Refresh

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'security/devshield-privacy-hardening-2026-09-30'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Refresh patched Next.js dependency
        run: npm install next@15.5.26 --save-exact --package-lock-only --ignore-scripts

      - name: Commit lockfile refresh when needed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: upgrade Next.js to patched 15.5.26"
          git push origin HEAD:"${{ github.head_ref }}"
