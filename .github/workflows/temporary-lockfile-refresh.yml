name: Temporary lockfile security refresh

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-lockfile-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'mabrig1/Scholar' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/scholar-dependency-security-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout security branch only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/scholar-dependency-security-20261110
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - name: Upgrade patched package versions and regenerate lockfile
        run: |
          npm pkg set dependencies.next=15.5.29
          npm pkg set overrides.sharp=0.35.5
          npm pkg set overrides.source-map-js=1.2.2
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci
      - name: Security gate
        run: npm audit --audit-level=high
      - name: Typecheck, tests, production build
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Commit patches and remove temporary workflow
        run: |
          git rm .github/workflows/temporary-lockfile-refresh.yml
          git add package.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --stat
          git commit -m "security: patch Next.js Sharp and source-map-js with regenerated lockfile"
          git push origin HEAD:fix/scholar-dependency-security-20261110
